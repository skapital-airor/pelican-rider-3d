<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑士 · Pelican Rider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b2a; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }
  #c { position: fixed; inset: 0; display: block; }

  #hud {
    position: fixed; top: 20px; left: 24px; z-index: 10; pointer-events: none;
    text-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  #hud h1 { font-size: 27px; letter-spacing: 2px; font-weight: 800; }
  #hud h1 span { font-size: 12px; font-weight: 500; opacity: .75; margin-left: 10px; letter-spacing: 4px; }
  #hud .stat { margin-top: 7px; font-size: 13px; opacity: .95; letter-spacing: .5px; }
  #hud .stat b { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #hud .sub { margin-top: 5px; font-size: 10px; opacity: .5; letter-spacing: 2.5px; }

  #panel {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10;
    background: rgba(10, 17, 28, .5); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 13px 18px 10px;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    box-shadow: 0 12px 44px rgba(0,0,0,.4); max-width: 94vw;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
    color: #fff; font-size: 13px; letter-spacing: .5px; padding: 7px 15px; border-radius: 999px; cursor: pointer;
    transition: all .18s ease; font-family: inherit; white-space: nowrap;
  }
  button:hover { background: rgba(255,255,255,.2); transform: translateY(-1px); }
  button.on { background: #ffd54f; color: #1a2230; border-color: #ffd54f; font-weight: 700; }
  .slider { align-items: center; gap: 10px; font-size: 13px; }
  .slider input { width: 180px; accent-color: #ffd54f; cursor: pointer; }
  .slider span:last-child { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .hint { font-size: 11px; opacity: .5; letter-spacing: 1px; }

  #vignette { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.4) 100%); }

  #audioTip {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 11;
    font-size: 12px; letter-spacing: 2px; opacity: .85; pointer-events: none;
    background: rgba(10,17,28,.45); padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(8px);
    transition: opacity .6s ease;
  }
  #audioTip.hide { opacity: 0; }

  #loader { position: fixed; inset: 0; z-index: 50; background: #0d1b2a; display: flex;
    flex-direction: column; gap: 20px; align-items: center; justify-content: center;
    transition: opacity .9s ease; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spin { width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.12); border-top-color: #ffd54f;
    animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #loader p { font-size: 13px; letter-spacing: 6px; opacity: .75; }
  #loader .en { font-size: 10px; letter-spacing: 4px; opacity: .4; }

  #err { position: fixed; inset: auto 12px 12px 12px; z-index: 60; display: none;
    background: #b71c1c; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 12px; }

  @media (max-width: 640px) {
    #hud h1 { font-size: 20px; }
    .slider input { width: 120px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="hud">
  <h1>鹈鹕骑士 <span>PELICAN RIDER</span></h1>
  <div class="stat"><b id="speedVal">18</b> km/h &nbsp;·&nbsp; 里程 <b id="distVal">0.00</b> km &nbsp;·&nbsp; <span id="todLabel">白天</span></div>
  <div class="sub">THREE.JS · PROCEDURAL · BLOOM · WEBAUDIO</div>
</div>

<div id="audioTip">点击任意处开启声音</div>

<div id="panel">
  <div class="row">
    <button data-cam="follow" class="on">跟随</button>
    <button data-cam="side">侧面</button>
    <button data-cam="front">正面</button>
    <button data-cam="orbit">自由</button>
  </div>
  <div class="row">
    <button id="bellBtn">🔔 铃铛 (B)</button>
    <button id="wheelieBtn">🚲 翘头 (W)</button>
    <button id="dayBtn">🌙 夜晚</button>
    <button id="sndBtn">🔊 声音开</button>
  </div>
  <div class="row slider">
    <span>速度</span>
    <input id="spd" type="range" min="0" max="14" step="0.1" value="5">
    <span id="spdVal">18 km/h</span>
  </div>
  <div class="hint">↑↓ 调速 · ←→ 变道 · B 铃铛 · W 翘头 · 自由模式拖拽旋转视角</div>
</div>

<div id="loader"><div class="spin"></div><p>鹈鹕骑士加载中</p><div class="en">PELICAN RIDER</div></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.addEventListener('error', e => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '加载出错: ' + (e.message || e.type) + '（如 three.js CDN 无法访问，请检查网络）';
});

/* ============ 渲染器 / 后期 ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xa9dcf2, 55, 330);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 900);
camera.position.set(3, 3.3, 7.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.enabled = false;

const composer = new EffectComposer(renderer);
composer.setSize(Math.max(innerWidth, 1), Math.max(innerHeight, 1));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============ 灯光 ============ */
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6b8e5a, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2df, 1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 160 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xcfe4ff, 0.5);
rim.position.set(4, 7, 9);
scene.add(rim);

/* ============ 工具 ============ */
const UP = new THREE.Vector3(0, 1, 0);
const _d = new THREE.Vector3(), _m = new THREE.Vector3(), _q = new THREE.Quaternion();
function setTube(mesh, a, b) {
  _d.subVectors(b, a);
  const len = Math.max(_d.length(), 1e-4);
  mesh.scale.set(1, len, 1);
  _m.addVectors(a, b).multiplyScalar(0.5);
  mesh.position.copy(_m);
  _q.setFromUnitVectors(UP, _d.normalize());
  mesh.quaternion.copy(_q);
}
function tube(ax, ay, az, bx, by, bz, r, mat, parent) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), mat);
  setTube(mesh, new THREE.Vector3(ax, ay, az), new THREE.Vector3(bx, by, bz));
  mesh.castShadow = true;
  (parent || scene).add(mesh);
  return mesh;
}
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

function glowTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.35, 'rgba(255,255,255,.45)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}
const glowTex = glowTexture();

/* ============ 天空穹顶（渐变 + 太阳圆盘/光晕） ============ */
const skyUni = {
  topColor: { value: new THREE.Color(0x2575c9) },
  midColor: { value: new THREE.Color(0xa9dcf2) },
  botColor: { value: new THREE.Color(0x6f9355) },
  sunDir: { value: new THREE.Vector3(0, 1, 0) },
  sunTint: { value: new THREE.Color(0xffedbe) },
  sunI: { value: 1.0 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUni, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 botColor;
    uniform vec3 sunTint;
    uniform vec3 sunDir;
    uniform float sunI;
    void main() {
      vec3 d = normalize(vDir);
      vec3 col = d.y > 0.0
        ? mix(midColor, topColor, pow(d.y, 0.6))
        : mix(midColor, botColor, pow(-d.y, 0.5));
      float s = max(dot(d, sunDir), 0.0);
      col += sunTint * (pow(s, 400.0) * 1.4 + pow(s, 24.0) * 0.22) * sunI;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(420, 32, 16), skyMat);
skyDome.renderOrder = -1;
scene.add(skyDome);

/* ============ 材质 ============ */
const M = {
  frame:  new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: .3, metalness: .6 }),
  tire:   new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: .95 }),
  rim:    new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: .22, metalness: .85 }),
  metal:  new THREE.MeshStandardMaterial({ color: 0x90a4ae, roughness: .35, metalness: .7 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: .6, metalness: .3 }),
  seat:   new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: .75 }),
  tape:   new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: .85 }),
  white:  new THREE.MeshStandardMaterial({ color: 0xf7f5ef, roughness: .8 }),
  beak:   new THREE.MeshStandardMaterial({ color: 0xff9e3d, roughness: .55 }),
  pouch:  new THREE.MeshStandardMaterial({ color: 0xffab8f, roughness: .7 }),
  leg:    new THREE.MeshStandardMaterial({ color: 0xff8f00, roughness: .65 }),
  eyeW:   new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: .3 }),
  pupil:  new THREE.MeshStandardMaterial({ color: 0x101418, roughness: .25 }),
  tip:    new THREE.MeshStandardMaterial({ color: 0x26333b, roughness: .75 }),
  scarf:  new THREE.MeshStandardMaterial({ color: 0xd62828, roughness: .7, side: THREE.DoubleSide }),
  trunk:  new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: .9 }),
  dash:   new THREE.MeshStandardMaterial({ color: 0xeceff1, roughness: .8 }),
};
const leafMats = [0x558b2f, 0x689f38, 0x7cb342, 0x33691e].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: .9, flatShading: true }));
const cherryMats = [0xf8bbd0, 0xf48fb1, 0xfce4ec].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: .9, flatShading: true }));

/* ============ 自行车 ============ */
const rig = new THREE.Group();
rig.position.set(0, 0, 0.95);
scene.add(rig);
const bike = new THREE.Group();
bike.position.set(0, 0, -0.95);
rig.add(bike);

const BB = { x: 0, y: 0.70, z: 0.12 }, CR = 0.26, WHEEL_R = 0.5;

function makeWheel() {
  const g = new THREE.Group();
  const spin = new THREE.Group();
  g.add(spin);
  const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R, 0.065, 14, 36), M.tire);
  const rimM = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.07, 0.016, 8, 36), M.rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.1, 12), M.metal);
  hub.rotation.z = Math.PI / 2;
  spin.add(tire, rimM, hub);
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2;
    tube(Math.cos(a) * 0.045, Math.sin(a) * 0.045, 0, Math.cos(a + 0.35) * 0.415, Math.sin(a + 0.35) * 0.415, 0, 0.006, M.metal, spin);
  }
  g.rotation.y = Math.PI / 2;
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { g, spin };
}
const wheelF = makeWheel(), wheelB = makeWheel();
wheelF.g.position.set(0, WHEEL_R, -1.0);
wheelB.g.position.set(0, WHEEL_R, 0.95);
bike.add(wheelF.g, wheelB.g);

tube(BB.x, BB.y, BB.z, 0, 1.32, 0.48, 0.042, M.frame, bike);
tube(BB.x, BB.y, BB.z, 0, 1.06, -0.88, 0.047, M.frame, bike);
tube(0, 1.30, 0.46, 0, 1.38, -0.78, 0.038, M.frame, bike);
tube(0, 1.38, -0.78, 0, 1.06, -0.88, 0.052, M.frame, bike);
for (const s of [-1, 1]) {
  tube(s * 0.07, 1.32, 0.48, s * 0.05, WHEEL_R, 0.95, 0.026, M.frame, bike);
  tube(s * 0.06, BB.y, BB.z, s * 0.05, WHEEL_R, 0.95, 0.026, M.frame, bike);
  tube(s * 0.05, 1.06, -0.88, s * 0.045, WHEEL_R, -1.0, 0.03, M.frame, bike);
}
/* 水壶（车架三角内） */
{
  const dirV = new THREE.Vector3(0, 1.06, -0.88).sub(new THREE.Vector3(BB.x, BB.y, BB.z)).normalize();
  const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.2, 12),
    new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: .4 }));
  bottle.quaternion.setFromUnitVectors(UP, dirV);
  bottle.position.set(0, 0.92, -0.30);
  bottle.castShadow = true;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.04, 8), M.dark);
  cap.quaternion.copy(bottle.quaternion);
  cap.position.copy(bottle.position).addScaledVector(dirV, 0.12);
  bike.add(bottle, cap);
}
/* 把立 + 弯把 */
tube(0, 1.38, -0.78, 0, 1.52, -0.70, 0.032, M.metal, bike);
{
  const barTop = new THREE.Mesh(new THREE.CylinderGeometry(0.023, 0.023, 0.42, 8), M.metal);
  barTop.rotation.z = Math.PI / 2; barTop.position.set(0, 1.52, -0.70); barTop.castShadow = true;
  bike.add(barTop);
  for (const s of [-1, 1]) {
    const drop = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.021, 8, 12, Math.PI * 1.15), M.tape);
    drop.position.set(s * 0.21, 1.50, -0.70);
    drop.rotation.set(0, s * Math.PI / 2, s > 0 ? -0.5 : Math.PI + 0.5);
    drop.castShadow = true;
    bike.add(drop);
    const lever = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.09, 0.06), M.dark);
    lever.position.set(s * 0.21, 1.55, -0.74); lever.rotation.x = 0.5;
    bike.add(lever);
  }
}
/* 座垫 */
const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), M.seat);
saddle.scale.set(0.85, 0.28, 1.15);
saddle.position.set(0, 1.38, 0.50); saddle.castShadow = true;
bike.add(saddle);
/* 牙盘 / 链条 / 曲柄 */
const chainring = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.02, 28), M.dark);
chainring.rotation.z = Math.PI / 2; chainring.position.set(0.07, BB.y, BB.z); chainring.castShadow = true;
const ringGuard = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.012, 6, 28), M.metal);
ringGuard.rotation.y = Math.PI / 2; ringGuard.position.set(0.07, BB.y, BB.z);
bike.add(chainring, ringGuard);
const cog = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.02, 16), M.dark);
cog.rotation.z = Math.PI / 2; cog.position.set(0.07, WHEEL_R, 0.95);
bike.add(cog);
tube(0.07, BB.y + 0.15, BB.z, 0.07, WHEEL_R + 0.06, 0.95, 0.011, M.dark, bike);
tube(0.07, BB.y - 0.15, BB.z, 0.07, WHEEL_R - 0.06, 0.95, 0.011, M.dark, bike);

const crankGroup = new THREE.Group();
crankGroup.position.set(BB.x, BB.y, BB.z);
bike.add(crankGroup);
tube(0.09, 0, 0, 0.09, CR, 0, 0.024, M.metal, crankGroup);
tube(-0.09, 0, 0, -0.09, -CR, 0, 0.024, M.metal, crankGroup);
tube(0.09, CR, 0, 0.28, CR, 0, 0.016, M.metal, crankGroup);
tube(-0.09, -CR, 0, -0.28, -CR, 0, 0.016, M.metal, crankGroup);
const pedalGeo = new THREE.BoxGeometry(0.17, 0.04, 0.11);
const pedalR = new THREE.Mesh(pedalGeo, M.dark); pedalR.position.set(0.28, CR, 0);
const pedalL = new THREE.Mesh(pedalGeo, M.dark); pedalL.position.set(-0.28, -CR, 0);
pedalR.castShadow = pedalL.castShadow = true;
crankGroup.add(pedalR, pedalL);

/* 车铃 */
const bellG = new THREE.Group();
bellG.position.set(0.17, 1.545, -0.68);
const bellDome = new THREE.Mesh(new THREE.SphereGeometry(0.048, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), M.rim);
bellDome.castShadow = true;
bellG.add(bellDome);
bike.add(bellG);

/* 车灯 */
tube(0, 1.06, -0.88, 0, 1.30, -0.95, 0.018, M.dark, bike);
const lampBody = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.12, 14), M.dark);
lampBody.rotation.x = -Math.PI / 2; lampBody.position.set(0, 1.30, -1.0); lampBody.castShadow = true;
bike.add(lampBody);
const lensMat = new THREE.MeshStandardMaterial({ color: 0xfff8dc, emissive: 0xfff3b0, emissiveIntensity: 0 });
const lens = new THREE.Mesh(new THREE.CircleGeometry(0.058, 18), lensMat);
lens.rotation.y = Math.PI; lens.position.set(0, 1.30, -1.065);
bike.add(lens);
const beam = new THREE.SpotLight(0xffe9a8, 0, 55, 0.55, 0.6, 1.4);
beam.position.set(0, 1.30, -1.05);
beam.target.position.set(0, 0.25, -12);
bike.add(beam, beam.target);
const beamGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffe9a8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
beamGlow.scale.set(0.8, 0.8, 1); beamGlow.position.set(0, 1.30, -1.08);
bike.add(beamGlow);
/* 尾灯 */
const tailLightMat = new THREE.MeshStandardMaterial({ color: 0x8e0000, emissive: 0xff1744, emissiveIntensity: 0 });
const tailLight = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), tailLightMat);
tailLight.position.set(0, 1.18, 0.66);
bike.add(tailLight);

/* ============ 鹈鹕 ============ */
const pelican = new THREE.Group();
bike.add(pelican);

const bodyBase = new THREE.Vector3(0.92, 0.82, 1.22);
const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 28, 20), M.white);
body.scale.copy(bodyBase);
body.position.set(0, 1.66, 0.42);
pelican.add(body);
const chest = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 14), M.white);
chest.position.set(0, 1.72, -0.02);
chest.scale.set(0.85, 0.9, 0.8);
pelican.add(chest);

/* 尾巴 */
const tailG = new THREE.Group(); tailG.position.set(0, 1.80, 0.98);
for (let i = -1; i <= 1; i++) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.025, 0.44), M.white);
  f.position.set(i * 0.10, 0.05, 0.16);
  f.rotation.set(-0.42, i * 0.35, 0);
  f.castShadow = true;
  tailG.add(f);
}

  const k1 = phi + a, k2 = phi - a;

  const kz = hz + L1 * Math.cos(phiK), ky = hy + L1 * Math.sin(phiK), kx = (hx + px) / 2;

  tDusk: new THREE.Color(0x3b3f6e), mDusk: new THREE.Color(0xff9a76), bDusk: new THREE.Color(0x4a3a4a),
  tNight: new THREE.Color(0x04060f), mNight: new THREE.Color(0x0c1826), bNight: new THREE.Color(0x05070d),
  gDay: new THREE.Color(0x7cb342), gNight: new THREE.Color(0x152419),
  sunDay: new THREE.Color(0xfff2df), sunNight: new THREE.Color(0x8fa8ff),
  sunWarm: new THREE.Color(0xffedbe), sunDusk: new THREE.Color(0xff8a50),
  mtNearDay: new THREE.Color(0x4a6b4f), mtNearNight: new THREE.Color(0x0a1210),
  mtFarDay: new THREE.Color(0x7fa3c0), mtFarNight: new THREE.Color(0x0b1420),
};
const _c1 = new THREE.Color(), _cSky = new THREE.Color();
const sunDir = new THREE.Vector3(), moonDir = new THREE.Vector3();

/* ============ 音效 ============ */
let AC = null, windGain = null;
function ensureAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320;
    windGain = AC.createGain(); windGain.gain.value = 0;
    src.connect(f); f.connect(windGain); windGain.connect(AC.destination);
    src.start();
    document.getElementById('audioTip').classList.add('hide');
  }
  if (AC.state === 'suspended') AC.resume();
}
function strike(t0, vol) {
  [2093, 2637].forEach((fr, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol / (i + 1), t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + 0.7);
  });
}
function ringBell() {
  ensureAudio();
  if (AC && !muted) {
    const t0 = AC.currentTime;
    strike(t0, 0.28); strike(t0 + 0.14, 0.18);
  }
  beakOpen = 1; headShake = 1; bellPulse = 1;
}
function squawk() {
  ensureAudio();
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(480, t0);
  o.frequency.exponentialRampToValueAtTime(240, t0 + 0.28);
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 2;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
  o.connect(f); f.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + 0.35);
}
window.addEventListener('pointerdown', ensureAudio);
window.addEventListener('keydown', ensureAudio);

/* ============ 交互 ============ */
const spdInput = document.getElementById('spd');
spdInput.addEventListener('input', () => { targetSpeed = parseFloat(spdInput.value); });
spdInput.addEventListener('pointerup', () => spdInput.blur());

document.querySelectorAll('[data-cam]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    camMode = btn.dataset.cam;
    controls.enabled = camMode === 'orbit';
  });
});
document.getElementById('bellBtn').addEventListener('click', ringBell);
document.getElementById('wheelieBtn').addEventListener('click', doWheelie);
const dayBtn = document.getElementById('dayBtn');
dayBtn.addEventListener('click', () => {
  nightMode = !nightMode;
  hourTarget = nightMode ? 0 : 12;
  dayBtn.textContent = nightMode ? '☀️ 白天' : '🌙 夜晚';
});
const sndBtn = document.getElementById('sndBtn');
sndBtn.addEventListener('click', () => {
  muted = !muted;
  sndBtn.textContent = muted ? '🔇 声音关' : '🔊 声音开';
  if (windGain) windGain.gain.value = 0;
});

/* #night 直接夜骑 */
if (location.hash.includes('night')) {
  hour = 0; hourTarget = 0; nightMode = true;
  dayBtn.textContent = '☀️ 白天';
}

function doWheelie() {
  if (wheelieT > 0.4) return;
  wheelieT = 1.7;
  squawk();
}

window.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  switch (e.code) {
    case 'ArrowUp': targetSpeed = Math.min(14, targetSpeed + 0.5); spdInput.value = targetSpeed; e.preventDefault(); break;
    case 'ArrowDown': targetSpeed = Math.max(0, targetSpeed - 0.5); spdInput.value = targetSpeed; e.preventDefault(); break;
    case 'ArrowLeft': laneX = Math.max(-2.4, laneX - 1.6); e.preventDefault(); break;
    case 'ArrowRight': laneX = Math.min(2.4, laneX + 1.6); e.preventDefault(); break;
    case 'KeyB': ringBell(); break;
    case 'KeyW': doWheelie(); break;
  }
});

/* ============ 主循环 ============ */
const clock = new THREE.Clock();
const speedVal = document.getElementById('speedVal');
const distVal = document.getElementById('distVal');
const spdVal = document.getElementById('spdVal');
const todLabel = document.getElementById('todLabel');
let firstFrame = true, hudT = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  speed += (targetSpeed - speed) * Math.min(1, 1.8 * dt);
  distance += speed * dt;
  const spdF = speed / 14;

  for (const o of scrollers) {
    o.position.z += speed * dt;
    if (o.position.z > o.userData.wrap) o.position.z -= o.userData.span;
  }
  for (const c of clouds) {
    c.position.z += (speed * 0.15 + 0.8) * dt;
    if (c.position.z > 80) c.position.z = -330;
  }
  for (const f of flowerData) {
    f.z += speed * dt;
    if (f.z > WRAP_Z) f.z -= SPAN;
    _m4.compose(_m.set(f.x, f.y, f.z), _qId, _s3.set(f.s, f.s, f.s));
    f.im.setMatrixAt(f.idx, _m4);
  }
  for (const im of flowerMeshes) im.instanceMatrix.needsUpdate = true;

  /* 自行车 */
  crank += (1.5 + speed * 1.15) * dt;
  crankGroup.rotation.x = crank;
  pedalR.rotation.x = -crank;
  pedalL.rotation.x = -crank;
  const roll = speed / WHEEL_R * dt;
  wheelF.spin.rotation.z -= roll;
  wheelB.spin.rotation.z -= roll;

  wheelieT = Math.max(0, wheelieT - dt);
  const wTarget = wheelieT > 0 ? 1 : 0;
  wheelie += (wTarget - wheelie) * Math.min(1, 5 * dt);
  rig.rotation.x = wheelie * (0.52 + Math.sin(t * 9) * 0.05 * wheelie);

  lanePrev = rig.position.x;
  rig.position.x += (laneX - rig.position.x) * Math.min(1, 4 * dt);
  const vx = (rig.position.x - lanePrev) / Math.max(dt, 1e-4);
  leanV += (vx - leanV) * Math.min(1, 6 * dt);
  rig.rotation.z = THREE.MathUtils.clamp(-leanV * 0.05, -0.18, 0.18);
  rig.position.y = Math.sin(t * 23) * 0.008 * spdF;

  /* 鹈鹕 */
  const bobY = Math.sin(crank * 2) * 0.022;
  pelican.position.y = bobY;
  pelican.rotation.x = -0.04 - spdF * 0.05;
  body.scale.set(bodyBase.x, bodyBase.y * (1 + Math.sin(t * 1.8) * 0.015), bodyBase.z);

  const gentle = 0.16 + Math.sin(t * 2.2) * 0.14;
  const strong = Math.sin(t * 11) * 0.75;
  const flap = gentle * (1 - wheelie) + strong * wheelie;
  wingR.rotation.z = flap;
  wingL.rotation.z = -flap;
  for (const f of feathers) f.pivot.rotation.z = f.side * flap * f.lag;

  solveLeg(legR, 1, crank, bobY);
  solveLeg(legL, -1, crank, bobY);

  /* 眨眼 */
  blinkT -= dt;
  if (blinkT <= 0) blinkT = rand(2.2, 4.5);
  const eyeT = blinkT < 0.14 ? 0.1 : 1;
  eyeScale += (eyeT - eyeScale) * Math.min(1, 25 * dt);
  for (const e of eyes) e.scale.y = eyeScale;

  beakOpen *= Math.exp(-3 * dt);
  headShake *= Math.exp(-2.5 * dt);
  bellPulse *= Math.exp(-4 * dt);
  pouchG.rotation.x = -beakOpen * 0.55;
  beakTopG.rotation.x = -0.05 + beakOpen * 0.15;
  headG.rotation.x = Math.sin(t * 2.4) * 0.06 - 0.05;
  headG.rotation.y = Math.sin(t * 0.5) * 0.15;
  headG.rotation.z = Math.sin(t * 30) * 0.08 * headShake;
  bellG.scale.setScalar(1 + bellPulse * 0.3 * Math.sin(t * 40));

  /* 围巾丝带：宽度方向沿长度扭转（扑动的布料感，各角度可见） */
  {
    const lift = 0.5 - spdF * 0.42;
    let px = 0, py = 2.20 + bobY, pz = 0.16;
    for (let i = 0; i <= RIB_N; i++) {
      const pitch = lift + Math.sin(t * (6 + spdF * 4) - i * 0.55) * (0.07 + spdF * 0.16);
      const sway = Math.sin(t * 3.2 - i * 0.5) * 0.12 * spdF;
      if (i > 0) {
        px += Math.sin(sway) * Math.cos(pitch) * RIB_STEP;
        py += Math.sin(pitch) * RIB_STEP;
        pz += Math.cos(sway) * Math.cos(pitch) * RIB_STEP;
      }
      const w = 0.075 * (1 - i / RIB_N * 0.35);
      const tw = t * 4.0 - i * 0.7;
      let sxx = Math.cos(tw), syy = Math.sin(tw) * 0.85;
      const sl = Math.hypot(sxx, syy) || 1;
      sxx = sxx / sl * w; syy = syy / sl * w;
      ribPos[i * 6] = px - sxx; ribPos[i * 6 + 1] = py - syy; ribPos[i * 6 + 2] = pz;
      ribPos[i * 6 + 3] = px + sxx; ribPos[i * 6 + 4] = py + syy; ribPos[i * 6 + 5] = pz;
    }
    ribGeo.attributes.position.needsUpdate = true;
    ribGeo.computeVertexNormals();
  }

  /* 花瓣 */
  for (let i = 0; i < PETAL_N; i++) {
    const meta = petalMeta[i];
    petalPos[i * 3] += Math.sin(t * 1.5 + meta.ph) * 0.35 * dt;
    petalPos[i * 3 + 1] -= meta.vy * dt;
    petalPos[i * 3 + 2] += (speed * 0.85 + 0.3) * dt;
    if (petalPos[i * 3 + 1] < 0.03 || petalPos[i * 3 + 2] > 30) resetPetal(i, false);
  }
  petalGeo.attributes.position.needsUpdate = true;

  /* 飞鸟 */
  for (const b of birds) {
    b.g.position.x += b.dir * b.spd * dt;
    if ((b.dir > 0 && b.g.position.x > 130) || (b.dir < 0 && b.g.position.x < -130)) {
      b.g.position.x = -b.dir * 130;
      b.g.position.z = rand(-160, -60);
      b.g.position.y = rand(24, 36);
    }
    const w = Math.sin(t * 9 + b.ph) * 0.5;
    b.wl.rotation.z = 0.3 + w;
    b.wr.rotation.z = -(0.3 + w);
  }

  /* 尘土 */
  const rate = (speed > 6 ? (speed - 6) * 6 : 0) + wheelie * 40;
  dustAcc += rate * dt;
  while (dustAcc >= 1) {
    dustAcc -= 1;
    const i = dustIdx = (dustIdx + 1) % DUST_N;
    dustPos[i * 3] = rig.position.x + rand(-0.15, 0.15);
    dustPos[i * 3 + 1] = 0.06;
    dustPos[i * 3 + 2] = 0.95 + rand(-0.1, 0.3);
    dustVel[i * 3] = rand(-0.4, 0.4);
    dustVel[i * 3 + 1] = rand(0.4, 1.1);
    dustVel[i * 3 + 2] = rand(1.2, 2.4);
    dustLife[i] = rand(0.5, 0.9);
  }
  for (let i = 0; i < DUST_N; i++) {
    if (dustLife[i] <= 0) continue;
    dustLife[i] -= dt;
    if (dustLife[i] <= 0) { dustPos[i * 3 + 1] = -999; continue; }
    dustPos[i * 3] += dustVel[i * 3] * dt;
    dustPos[i * 3 + 1] += dustVel[i * 3 + 1] * dt;
    dustPos[i * 3 + 2] += dustVel[i * 3 + 2] * dt;
    dustVel[i * 3 + 1] -= 2.2 * dt;
  }
  dustGeo.attributes.position.needsUpdate = true;

  /* 昼夜 */
  if (hour !== hourTarget) {
    let diff = ((hourTarget - hour + 36) % 24) - 12;
    const step = Math.sign(diff) * Math.min(Math.abs(diff), 6 * dt);
    hour = (hour + step + 24) % 24;
    if (Math.abs(diff) < 0.05) hour = hourTarget;
  } else if (autoCycleRate > 0) {
    hour = (hour + dt * autoCycleRate) % 24;
  }
  const sa = (hour - 6) / 12 * Math.PI;
  const el = Math.sin(sa), az = Math.cos(sa);
  const dayW = ss(-0.12, 0.28, el);
  const duskW = Math.max(0, 1 - Math.abs(el) / 0.28) * 0.75;
  const nightW = 1 - dayW;

  skyUni.topColor.value.copy(C.tNight).lerp(C.tDusk, duskW).lerp(C.tDay, dayW);
  skyUni.midColor.value.copy(C.mNight).lerp(C.mDusk, duskW).lerp(C.mDay, dayW);
  skyUni.botColor.value.copy(C.bNight).lerp(C.bDusk, duskW).lerp(C.bDay, dayW);
  scene.fog.color.copy(skyUni.midColor.value);
  sunDir.set(az, el, -0.35).normalize();
  skyUni.sunDir.value.copy(sunDir);
  skyUni.sunI.value = Math.max(dayW, duskW * 0.9) * 1.15;
  _cSky.copy(C.sunWarm).lerp(C.sunDusk, duskW * (1 - dayW));
  skyUni.sunTint.value.copy(_cSky);

  groundMat.color.copy(_c1.copy(C.gNight).lerp(C.gDay, dayW));
  roadMat.color.copy(_c1.copy(roadTint.night).lerp(roadTint.day, dayW));
  mtNearMat.color.copy(_c1.copy(C.mtNearNight).lerp(C.mtNearDay, dayW));
  mtFarMat.color.copy(_c1.copy(C.mtFarNight).lerp(C.mtFarDay, dayW));

  moonDir.set(-az, -el, -0.35).normalize();
  sun.position.copy(sunDir).lerp(moonDir, nightW).multiplyScalar(70);
  sun.intensity = lerp(0.5, 1.5, dayW);
  sun.color.copy(_c1.copy(C.sunNight).lerp(C.sunDay, dayW));
  hemi.intensity = lerp(0.28, 0.95, dayW);
  rim.intensity = lerp(0.7, 0.4, dayW);

  moonMesh.position.copy(moonDir).multiplyScalar(300);
  moonMesh.visible = el < 0.12;
  starMat.opacity = nightW * ss(-0.05, -0.3, el);

  lampHeadMat.emissiveIntensity = nightW * 2.5;
  lampGlowMat.opacity = nightW * 0.72;
  petals.material.opacity = 0.95 * dayW;
  petals.visible = dayW > 0.1;
  beam.intensity = nightW * 130;
  beamGlow.material.opacity = nightW * 0.7;
  lensMat.emissiveIntensity = nightW * 3;
  tailLightMat.emissiveIntensity = 0.4 + nightW * 3;

  /* 相机 */
  if (camMode === 'orbit') {
    controls.update();
  } else {
    const cm = camModes[camMode];
    _m.copy(cm.pos);
    _m.x += rig.position.x * 0.7;
    _m.y += Math.sin(t * 27) * 0.008 * spdF * spdF;
    camera.position.lerp(_m, 1 - Math.exp(-4 * dt));
    _d.copy(cm.look); _d.x += rig.position.x * 0.7;
    lookCur.lerp(_d, 1 - Math.exp(-4 * dt));
    camera.lookAt(lookCur);
  }

  /* HUD / 风声 */
  hudT += dt;
  if (hudT > 0.12) {
    hudT = 0;
    speedVal.textContent = Math.round(speed * 3.6);
    spdVal.textContent = Math.round(targetSpeed * 3.6) + ' km/h';
    distVal.textContent = (distance / 1000).toFixed(2);
    todLabel.textContent = dayW > 0.6 ? '白天' : (nightW > 0.6 ? '夜晚' : '黄昏');
  }
  if (windGain && AC) {
    windGain.gain.value += ((muted ? 0 : Math.min(0.26, spdF * 0.26)) - windGain.gain.value) * Math.min(1, 3 * dt);
  }

  composer.render();

  if (firstFrame) {
    firstFrame = false;
    document.getElementById('loader').classList.add('hide');
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
